<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anki Bulk Import — JS-only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-4">Anki Bulk Import</h1>
        <div>
          <button id="check-anki" class="btn btn-outline-secondary btn-sm">Check AnkiConnect</button>
        </div>
      </div>

      <div id="alerts"></div>

      <div class="mb-3 row">
        <div class="col-md-4">
          <label class="form-label">Deck name</label>
          <input id="deck" class="form-control" placeholder="Default" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Model name</label>
          <input id="model" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Tags</label>
          <input id="tags" class="form-control" placeholder="yomichan, example" />
        </div>
      </div>
      <div class="mb-3 row">
        <div class="col-md-4">
          <label class="form-label">Audio URL</label>
          <input id="audio-url" class="form-control" placeholder="https://..." />
        </div>
        <div class="col-md-4">
          <label class="form-label">Audio filename</label>
          <input id="audio-filename" class="form-control" placeholder="yomichan_ねこ_猫.mp3" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Audio skipHash</label>
          <input id="audio-skiphash" class="form-control" placeholder="7e2c2f954ef6051373ba916f000168dc" />
        </div>
      </div>

      <div class="mb-3">
        <h5>Words table</h5>
        <div class="mb-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addRow()">Add row</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearTable()">Clear table</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-bordered" id="words-table">
            <thead>
              <tr>
                <th>Words</th>
                <th>Type</th>
                <th>Reading</th>
                <th>Meaning</th>
                <th>Sentence</th>
                <th style="width:90px"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input name="word[]" class="form-control"/></td>
                <td><input name="type[]" class="form-control"/></td>
                <td><input name="reading[]" class="form-control"/></td>
                <td><input name="meaning[]" class="form-control"/></td>
                <td><input name="sentence[]" class="form-control"/></td>
                <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">Remove</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Or paste CSV / tab-separated text here (then click "Fill table from CSV")</label>
        <textarea id="csvtext" class="form-control" rows="6" placeholder="Words,Type,Reading,Meaning,Sentence"></textarea>
        <div class="d-flex gap-2 mt-2 align-items-center">
          <input id="delimiter" class="form-control form-control-sm w-auto" value="," />
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillTableFromCSV()">Fill table from CSV</button>
          <input id="file" type="file" class="form-control form-control-sm" accept=".csv,text/*" onchange="loadFile(event)" />
        </div>
      </div>

      <div class="mb-3 d-flex gap-2">
        <button id="import-btn" class="btn btn-primary" onclick="sendToAnki()">Import to Anki</button>
        <button id="export-csv" class="btn btn-outline-secondary" onclick="exportCSV()">Export CSV</button>
      </div>

      <hr />
      <h5>Notes</h5>
      <ul>
        <li>This is a pure static JavaScript app that calls AnkiConnect at <code>http://127.0.0.1:8765</code>.</li>
        <li>To avoid browser mixed-content restrictions, run the page from a local HTTP server (see README).</li>
      </ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
